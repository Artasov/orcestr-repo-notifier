name: Repo update to Telegram

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      task:
        description: What should Codex write about?
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Artasov/orcestr-repo-notifier@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: '@orcestrdev'
          telegram-message-thread-id: '2'
          telegram-parse-mode: HTML
          custom-task: ${{ github.event.inputs.task }}
          mode: product
          language: en
          model: gpt-5.6-luna
          effort: medium
          custom-prompt: |
            Write in English.
            Return only the final Telegram message text. Do not explain the format.
            These rules apply to automatic push updates and manual workflow tasks.
            Cover meaningful Orcestr Repo Notifier action, filtering, prompt generation, Telegram delivery, security, documentation, release, or workflow progress.
            For automatic push updates, output exactly ORCESTR_NOTIFY_SKIP only when the entire push is formatting-only or equivalent mechanical cleanup without semantic, configuration, documentation, workflow, dependency, or behavior changes.
            Do not skip meaningful action input, runtime filter, prompt, Telegram transport, CI/CD, release, documentation, security, dependency, or workflow changes.
            Group repeated changes into one concise bullet and name the affected action input, script, workflow, example, or release when the context proves it.
            Do not infer security, compatibility, delivery, or user-facing behavior that the diff does not prove.
            Avoid vague claims such as "better", "cleaner", "more robust", "polished", or "improved" unless the same bullet states exactly what changed.
            Use exactly this structure:
            First line: DEV UPDATE <b>Orcestr Repo Notifier</b>:
            For automatic push updates, second line: Stats: <commit_count> commits, +<added_lines>/-<deleted_lines> lines.
            Use the exact commit count and line counts from the Change Stats section in context.
            For manual workflow tasks, include the Stats line only if the task asks for change stats.
            Then 2-4 bullet lines. Every bullet line must start with "• ".
            Then one short closing line after a blank line.
            After the closing line, always add exactly these two final link lines:
            GitHub: https://github.com/Artasov/orcestr-repo-notifier
            Marketplace: https://github.com/marketplace/actions/orcestr-repo-notifier
            If the push contains a release or version bump, make the first bullet start with "• New release:" and state the exact version visible in the diff.
            Do not ask users to re-test, wait for a future fix, or perform follow-up work unless the manual task asks for it or the context proves it is required.
            Do not use Markdown headings, code fences, numbered lists, or plain paragraph lines for update items.
            Telegram HTML parse mode is enabled. Use <b>...</b> sparingly for the product name and one important action input or release version.
            Do not use unsupported HTML tags, colors, spans, inline styles, or raw angle-bracket placeholders.
            Do not include branch names, author names, commit hashes, raw file lists, compare links, or unrelated GitHub URLs.
            Keep every bullet concise, factual, and readable in Telegram.
